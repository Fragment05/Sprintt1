<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FriendlyEats{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">🍽️ FriendlyEats</a>
      <nav class="nav">
        <a class="nav-link" href="/">Restaurantes</a>
        <a class="btn btn-primary" href="/restaurants/new">+ Nuevo restaurante</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">FriendlyEats · Sprint 1 (versión local)</div>
  </footer>

  <script src="/static/js/app.js" defer></script>
</body>
</html>
